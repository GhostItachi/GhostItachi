<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

<style>

.bg {
    fill:#050505;
}

.border {
    fill:none;
    stroke:#1f1f1f;
    stroke-width:2;
}

.title {
    font-family:monospace;
    font-size:72px;
    font-weight:700;
    fill:white;
    letter-spacing:12px;
}

.subtitle {
    font-family:monospace;
    font-size:22px;
    fill:#b3b3b3;
}

.scan {
    animation: scanline 8s linear infinite;
}

.glow {
    animation: glow 4s ease-in-out infinite;
}

@keyframes scanline {

    0% {
        transform: translateY(-320px);
    }

    100% {
        transform: translateY(320px);
    }

}

@keyframes glow {

    0%,100% {
        opacity:0.7;
    }

    50% {
        opacity:1;
    }

}

</style>

<rect class="bg" width="1200" height="300"/>

<rect
x="10"
y="10"
width="1180"
height="280"
rx="16"
class="border"/>

<text
x="600"
y="130"
text-anchor="middle"
class="title glow">
GHOST
</text>

<text
x="600"
y="175"
text-anchor="middle"
class="subtitle">
Crafting software in the shadows.
</text>

<text
x="600"
y="215"
text-anchor="middle"
class="subtitle">
Full Stack Developer
</text>

<rect
x="0"
y="-40"
width="1200"
height="40"
fill="white"
opacity="0.025"
class="scan"/>

</svg>
