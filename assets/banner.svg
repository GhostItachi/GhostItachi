<svg
    width="1280"
    height="420"
    viewBox="0 0 1280 420"
    xmlns="http://www.w3.org/2000/svg">

    <defs>

        <!-- Grid -->
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40"
          fill="none"
          stroke="#181818"
          stroke-width="1"/>
</pattern>

<linearGradient id="lineGlow">
    <stop offset="0%" stop-color="#ffffff00"/>
    <stop offset="50%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ffffff00"/>
</linearGradient>

        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#050505"/>
            <stop offset="100%" stop-color="#111111"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <!-- Fondo -->
    <rect width="1280" height="420" fill="url(#bg)"/>

    <!-- Grid de fondo -->
<rect width="1280"
      height="420"
      fill="url(#grid)"
      opacity=".55"/>

    <!-- Líneas HUD -->

<line x1="35" y1="135" x2="515" y2="135"
      stroke="url(#lineGlow)"
      stroke-width="1"/>

<line x1="585" y1="135" x2="1230" y2="135"
      stroke="url(#lineGlow)"
      stroke-width="1"/>

<line x1="585" y1="300" x2="1230" y2="300"
      stroke="#2d2d2d"/>

<line x1="540" y1="40"
      x2="540"
      y2="380"
      stroke="#303030"/>

    <!-- Esquinas -->

<path d="M20 20 H60 M20 20 V60"
      stroke="white"
      stroke-width="2"
      fill="none"/>

<path d="M1260 20 H1220 M1260 20 V60"
      stroke="white"
      stroke-width="2"
      fill="none"/>

<path d="M20 400 H60 M20 400 V360"
      stroke="white"
      stroke-width="2"
      fill="none"/>

<path d="M1260 400 H1220 M1260 400 V360"
      stroke="white"
      stroke-width="2"
      fill="none"/>

    <!-- Marco exterior -->
    <rect
        x="8"
        y="8"
        width="1264"
        height="404"
        rx="6"
        fill="none"
        stroke="#2b2b2b"
        stroke-width="2"/>

    <!-- Panel izquierdo -->
    <rect
        x="20"
        y="40"
        width="520"
        height="340"
        rx="8"
        fill="#0d0d0d"
        stroke="#3a3a3a"/>

    <!-- Panel derecho -->
    <rect
        x="560"
        y="40"
        width="700"
        height="340"
        rx="8"
        fill="#0d0d0d"
        stroke="#3a3a3a"/>

    <!-- Encabezado -->
    <text
        x="28"
        y="22"
        fill="#888"
        font-size="12"
        font-family="monospace">
        GHOST // PROFILE INTERFACE
    </text>

    <text
        x="1180"
        y="22"
        fill="#d8d8d8"
        font-size="12"
        font-family="monospace">
        SYSTEM ONLINE
    </text>

    <circle
        cx="1252"
        cy="18"
        r="3"
        fill="#8cff8c"
        filter="url(#glow)"/>

<!-- ========================= -->
<!-- PANEL IZQUIERDO -->
<!-- ========================= -->

<!-- Nombre -->
<text
    x="55"
    y="95"
    fill="white"
    font-size="64"
    font-weight="bold"
    font-family="Segoe UI, Arial, sans-serif"
    filter="url(#glow)">
    Gh0$t_
</text>

<!-- Subtítulo -->
<text
    x="58"
    y="122"
    fill="#BDBDBD"
    font-size="14"
    letter-spacing="3"
    font-family="monospace">
    CRAFTING SOFTWARE IN THE SHADOWS
</text>

<!-- Información -->
<text x="58" y="170" fill="#777" font-size="12" font-family="monospace">ROLE</text>
<text x="58" y="192" fill="white" font-size="18">Full Stack Developer</text>

<text x="58" y="235" fill="#777" font-size="12" font-family="monospace">FOCUS</text>
<text x="58" y="257" fill="white" font-size="16">
    Building elegant software
</text>
<text x="58" y="278" fill="white" font-size="16">
    &amp; Linux customization
</text>

<!-- Estado -->
<rect
    x="50"
    y="315"
    width="210"
    height="45"
    rx="6"
    fill="#111"
    stroke="#444"/>

<circle
    cx="68"
    cy="337"
    r="5"
    fill="#7CFF7C"
    filter="url(#glow)">
    <animate attributeName="opacity"
             values="1;.2;1"
             dur="2s"
             repeatCount="indefinite"/>
</circle>

<text
    x="82"
    y="342"
    fill="white"
    font-size="14"
    font-family="monospace">
    ONLINE
</text>

<!-- ========================= -->
<!-- PANEL DERECHO -->
<!-- ========================= -->

<!-- Tech Stack -->
<rect x="585" y="55" width="645" height="70" rx="6"
      fill="#101010" stroke="#333"/>

<text x="605" y="77"
      fill="#9a9a9a"
      font-size="12"
      font-family="monospace">
TECH STACK
</text>

<!-- Iconos temporales -->
<g fill="white" font-family="Segoe UI" font-size="16">

<rect x="620" y="90" width="32" height="22" rx="4" fill="#222"/>
<text x="627" y="106">TS</text>

<rect x="690" y="90" width="32" height="22" rx="4" fill="#222"/>
<text x="698" y="106">JS</text>

<rect x="760" y="90" width="32" height="22" rx="4" fill="#222"/>
<text x="766" y="106">N</text>

<rect x="830" y="90" width="32" height="22" rx="4" fill="#222"/>
<text x="835" y="106">R</text>

<rect x="900" y="90" width="32" height="22" rx="4" fill="#222"/>
<text x="907" y="106">G</text>

</g>

<!-- GitHub Stats -->
<rect x="585" y="145" width="390" height="140" rx="6"
      fill="#101010" stroke="#333"/>

<text x="605" y="167"
      fill="#9a9a9a"
      font-size="12"
      font-family="monospace">
GITHUB STATS
<!-- Repositories -->
<text x="900" y="200" fill="white" text-anchor="end">
    {{repos}}
</text>

<!-- Followers -->
<text x="900" y="230" fill="white" text-anchor="end">
    {{followers}}
</text>

<!-- Stars -->
<text x="900" y="260" fill="white" text-anchor="end">
    {{stars}}
</text>

<!-- Commits -->
<text x="610" y="290" fill="white" font-size="16">
    Commits
</text>

<text x="900" y="290" fill="white" text-anchor="end">
    {{commits}}
</text>

<!-- Círculo central -->
<text
    x="925"
    y="225"
    text-anchor="middle"
    fill="white"
    font-size="22">
    {{level}}
</text>

<text x="1015" y="200" fill="white" font-size="13">
    {{lang1}}
</text>

<rect x="1100" y="191" width="100" height="8" fill="#222"/>
<rect x="1100" y="191" width="{{lang1_width}}" height="8" fill="white"/>

<text x="1015" y="225" fill="white" font-size="13">
    {{lang2}}
</text>

<rect x="1100" y="216" width="100" height="8" fill="#222"/>
<rect x="1100" y="216" width="{{lang2_width}}" height="8" fill="white"/>

<text x="1015" y="250" fill="white" font-size="13">
    {{lang3}}
</text>

<rect x="1100" y="241" width="100" height="8" fill="#222"/>
<rect x="1100" y="241" width="{{lang3_width}}" height="8" fill="white"/>

<!-- Barra 1 -->
<text x="1015" y="200" fill="white" font-size="13">TypeScript</text>
<rect x="1100" y="191" width="100" height="8" fill="#222"/>
<rect x="1100" y="191" width="82" height="8" fill="white"/>

<!-- Barra 2 -->
<text x="1015" y="225" fill="white" font-size="13">JavaScript</text>
<rect x="1100" y="216" width="100" height="8" fill="#222"/>
<rect x="1100" y="216" width="55" height="8" fill="white"/>

<!-- Barra 3 -->
<text x="1015" y="250" fill="white" font-size="13">HTML/CSS</text>
<rect x="1100" y="241" width="100" height="8" fill="#222"/>
<rect x="1100" y="241" width="35" height="8" fill="white"/>
    
</svg>
