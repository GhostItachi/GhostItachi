<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">

<style>
.background {
  fill: #050505;
}

.border {
  fill: none;
  stroke: #1A1A1A;
  stroke-width: 2;
}

.title {
  fill: #FFFFFF;
  font-family: monospace;
  font-size: 84px;
  font-weight: bold;
  letter-spacing: 8px;
}

.subtitle {
  fill: #A0A0A0;
  font-family: monospace;
  font-size: 20px;
}

.label {
  fill: #6B6B6B;
  font-family: monospace;
  font-size: 14px;
  letter-spacing: 2px;
}

.value {
  fill: #FFFFFF;
  font-family: monospace;
  font-size: 14px;
}

.cursor {
  animation: blink 1.2s infinite;
}

.scanline {
  animation: scan 8s linear infinite;
}

@keyframes blink {
  0%, 45% { opacity: 1; }
  46%, 100% { opacity: 0; }
}

@keyframes scan {
  0% {
    transform: translateY(-340px);
  }
  100% {
    transform: translateY(340px);
  }
}
</style>

<rect class="background" width="1280" height="320"/>

<rect
x="12"
y="12"
width="1256"
height="296"
rx="18"
class="border"
/>

<line x1="60" y1="80" x2="1220" y2="80" stroke="#121212"/>

<text x="70" y="55" class="label">PROFILE INTERFACE</text>

<text
x="80"
y="180"
class="title">
Gho$t<tspan class="cursor">_</tspan>
</text>

<text
x="82"
y="220"
class="subtitle">
Crafting software in the shadows.
</text>

<text x="820" y="130" class="label">ROLE</text>
<text x="820" y="155" class="value">Full Stack Developer</text>

<text x="820" y="190" class="label">STACK</text>
<text x="820" y="215" class="value">TypeScript • Node.js • UI Engineering</text>

<text x="820" y="250" class="label">STATUS</text>
<text x="820" y="275" class="value">ONLINE</text>

<rect
x="0"
y="-30"
width="1280"
height="30"
fill="white"
opacity="0.02"
class="scanline"
/>

</svg>
