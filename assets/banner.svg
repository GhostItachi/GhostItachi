<svg
    width="1280"
    height="420"
    viewBox="0 0 1280 420"
    xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#050505"/>
            <stop offset="100%" stop-color="#111111"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <!-- Fondo -->
    <rect width="1280" height="420" fill="url(#bg)"/>

    <!-- Marco exterior -->
    <rect
        x="8"
        y="8"
        width="1264"
        height="404"
        rx="6"
        fill="none"
        stroke="#2b2b2b"
        stroke-width="2"/>

    <!-- Panel izquierdo -->
    <rect
        x="20"
        y="40"
        width="520"
        height="340"
        rx="8"
        fill="#0d0d0d"
        stroke="#3a3a3a"/>

    <!-- Panel derecho -->
    <rect
        x="560"
        y="40"
        width="700"
        height="340"
        rx="8"
        fill="#0d0d0d"
        stroke="#3a3a3a"/>

    <!-- Encabezado -->
    <text
        x="28"
        y="22"
        fill="#888"
        font-size="12"
        font-family="monospace">
        GHOST // PROFILE INTERFACE
    </text>

    <text
        x="1180"
        y="22"
        fill="#d8d8d8"
        font-size="12"
        font-family="monospace">
        SYSTEM ONLINE
    </text>

    <circle
        cx="1252"
        cy="18"
        r="3"
        fill="#8cff8c"
        filter="url(#glow)"/>

</svg>
